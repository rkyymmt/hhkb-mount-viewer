<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const DATA = JSON.parse(document.getElementById('vdata').textContent);
const K = DATA.consts;
const b64f32 = s => { const b = Uint8Array.from(atob(s), c => c.charCodeAt(0)); return new Float32Array(b.buffer, b.byteOffset, b.length / 4); };
const b64u32 = s => { const b = Uint8Array.from(atob(s), c => c.charCodeAt(0)); return new Uint32Array(b.buffer, b.byteOffset, b.length / 4); };

// ---------- four-bar solver (same as the design PV solver) ----------
const TH0 = K.thClosed, TH1 = K.thOpen, NST = 240;
function solve(thDeg, Tprev) {
  const th = thDeg * Math.PI / 180, c = Math.cos(th), s = Math.sin(th);
  const R1 = [K.F1[0] - (c * K.c1[0] - s * K.c1[1]), K.F1[1] - (s * K.c1[0] + c * K.c1[1])];
  const R2 = [K.F2[0] - (c * K.c2[0] - s * K.c2[1]), K.F2[1] - (s * K.c2[0] + c * K.c2[1])];
  const dv = [R2[0] - R1[0], R2[1] - R1[1]], dist = Math.hypot(dv[0], dv[1]);
  const a = (K.A * K.A - K.B * K.B + dist * dist) / (2 * dist);
  const h = Math.sqrt(Math.max(K.A * K.A - a * a, 0));
  const Pm = [R1[0] + a * dv[0] / dist, R1[1] + a * dv[1] / dist];
  const off = [h * -dv[1] / dist, h * dv[0] / dist];
  const cA = [Pm[0] + off[0], Pm[1] + off[1]], cB = [Pm[0] - off[0], Pm[1] - off[1]];
  const dA = Math.hypot(cA[0] - Tprev[0], cA[1] - Tprev[1]), dB = Math.hypot(cB[0] - Tprev[0], cB[1] - Tprev[1]);
  return dA <= dB ? cA : cB;
}
const POSES = [];
{
  let T = [K.Tc[0], K.Tc[1]];
  for (let i = 0; i <= NST; i++) {
    const th = TH0 + (TH1 - TH0) * i / NST;
    T = solve(th, T);
    POSES.push({ th, T: [T[0], T[1]] });
  }
}
function poseAt(frac) {
  const x = frac * NST, i = Math.min(Math.floor(x), NST - 1), f = x - i;
  const th = POSES[i].th + (POSES[i + 1].th - POSES[i].th) * f;
  const thr = th * Math.PI / 180;
  return { c: Math.cos(thr), s: Math.sin(thr),
           Tx: POSES[i].T[0] * (1 - f) + POSES[i + 1].T[0] * f,
           Ty: POSES[i].T[1] * (1 - f) + POSES[i + 1].T[1] * f };
}

const geoCache = {};
function getGeo(id) {
  if (geoCache[id]) return geoCache[id];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(b64f32(DATA.geos[id].pos), 3));
  g.setIndex(new THREE.BufferAttribute(b64u32(DATA.geos[id].idx), 1));
  geoCache[id] = g;
  return g;
}
const meshes = DATA.parts.map(p => {
  const col = new THREE.Color(p.color[0] / 255, p.color[1] / 255, p.color[2] / 255);
  const isMetal = p.geo === 'screws';
  const mat = new THREE.MeshStandardMaterial({ color: col, roughness: isMetal ? 0.34 : 0.58,
    metalness: isMetal ? 0.85 : 0.12, flatShading: true, envMapIntensity: 0.5 });
  const m = new THREE.Mesh(getGeo(p.geo), mat);
  m.castShadow = true; m.receiveShadow = true;
  m.matrixAutoUpdate = false;
  root.add(m);
  return { mesh: m, kind: p.kind, geo: p.geo };
});

// ---------- per-frame part matrices (render frame) ----------
const MIR = new THREE.Matrix4().set(1, 0, 0, 0,  0, -1, 0, -294,  0, 0, 1, 0,  0, 0, 0, 1);
const _m = new THREE.Matrix4(), _t = new THREE.Matrix4();
function matLid(P, dy) {
  return new THREE.Matrix4().set(
    P.c, -P.s, 0, P.Tx,
    0, 0, 1, dy,
    P.s, P.c, 0, P.Ty,
    0, 0, 0, 1);
}
function matArm(F, C, zoff) {
  const phi = Math.atan2(C[1] - F[1], C[0] - F[0]), c = Math.cos(phi), s = Math.sin(phi);
  return new THREE.Matrix4().set(
    c, -s, 0, F[0],
    0, 0, 1, zoff,
    s, c, 0, F[1],
    0, 0, 0, 1);
}
function trans(x, y, z) { return new THREE.Matrix4().set(1, 0, 0, x, 0, 1, 0, y, 0, 0, 1, z, 0, 0, 0, 1); }

function updatePose(frac, explode) {
  const P = poseAt(frac);
  const C1w = [P.Tx + P.c * K.c1[0] - P.s * K.c1[1], P.Ty + P.s * K.c1[0] + P.c * K.c1[1]];
  const C2w = [P.Tx + P.c * K.c2[0] - P.s * K.c2[1], P.Ty + P.s * K.c2[0] + P.c * K.c2[1]];
  for (const { mesh, kind } of meshes) {
    let M;
    if (kind.type === 'static') {
      M = _m.identity();
      if (kind.explode) M = trans(0, kind.side * kind.explode * explode, 0);
    } else if (kind.type === 'arm') {
      const F = K[kind.pivot], C = kind.pivot === 'F1' ? C1w : C2w;
      M = matArm(F, C, kind.zoff);
      if (kind.side < 0) M = _m.copy(MIR).multiply(M);
      if (kind.explode) M = trans(0, kind.side * kind.explode * explode, 0).multiply(M);
    } else if (kind.type === 'lid') {
      M = matLid(P, kind.dy);
      if (kind.side < 0) M = _m.copy(MIR).multiply(M);
      if (kind.explode) {
        if (kind.mode === 'normal') {
          const n = [-P.s, 0, P.c], d = kind.explode * explode;
          M = trans(n[0] * d, n[1] * d, n[2] * d).multiply(M);
        } else {
          M = trans(0, kind.side * kind.explode * explode, 0).multiply(M);
        }
      }
    } else if (kind.type === 'cliplid') {
      const pt = K[kind.pt];
      M = matLid(P, 0).multiply(trans(pt[0], pt[1], kind.rim));
      if (kind.side < 0) M = _m.copy(MIR).multiply(M);
      if (kind.explode) M = trans(0, kind.side * kind.explode * explode, 0).multiply(M);
    }
    mesh.matrix.copy(M);
    mesh.matrixWorldNeedsUpdate = true;
  }
}

// ---------- framing (v54: fit to the PARTS only) ----------
// The ground disc (r=900) is excluded from the fit: a root-wide bounding
// box used to include it, which inflated the bounding sphere and made the
// model render tiny. DIST is solved from the parts box's projected size
// so the model fills about 90% of the screen height at load (hero view);
// the view presets reuse the same fitted DIST.
const state = { frac: 0, explode: 0, anim: null, playing: false, playDir: 1, hold: 0, camAnim: null };
updatePose(1, 0);
root.updateMatrixWorld(true);
const box = new THREE.Box3();
for (const { mesh } of meshes) box.expandByObject(mesh);
const center = box.getCenter(new THREE.Vector3());
const sphere = box.getBoundingSphere(new THREE.Sphere());
root.position.set(-center.x, -box.min.y, -center.z);
const TARGET = new THREE.Vector3(0, (box.max.y - box.min.y) * 0.52, 0);
function viewDir(name) {
  const v = {
    hero: [-0.92, 0.48, 0.82], front: [-1, 0.10, 0], back: [1, 0.10, 0],
    top: [0.03, 1, 0.03], bottom: [0.03, -1, 0.03], right: [0, 0.10, 1], left: [0, 0.10, -1]
  }[name];
  return new THREE.Vector3(...v).normalize();
}
function projectedSize(dir) {
  const up0 = new THREE.Vector3(0, 1, 0);
  const upv = up0.clone().addScaledVector(dir, -up0.dot(dir));
  if (upv.lengthSq() < 1e-6) upv.set(0, 0, -1); else upv.normalize();
  const right = new THREE.Vector3().crossVectors(upv, dir);
  let hMin = 1e9, hMax = -1e9, wMin = 1e9, wMax = -1e9;
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) {
    const p = new THREE.Vector3(x, y, z).add(root.position).sub(TARGET);
    const h = p.dot(upv), w = p.dot(right);
    if (h < hMin) hMin = h; if (h > hMax) hMax = h;
    if (w < wMin) wMin = w; if (w > wMax) wMax = w;
  }
  return { h: hMax - hMin, w: wMax - wMin };
}
const _ps = projectedSize(viewDir('hero'));
const _tanF = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
const DIST = Math.max(_ps.h / (2 * _tanF * 0.90), _ps.w / (2 * _tanF * camera.aspect * 0.94));
controls.target.copy(TARGET);
controls.minDistance = sphere.radius * 0.35;
controls.maxDistance = sphere.radius * 9;
camera.position.copy(TARGET).addScaledVector(viewDir('hero'), DIST);
function goView(name) {
  const to = TARGET.clone().addScaledVector(viewDir(name), DIST);
  state.camAnim = { t: 0, dur: 0.7, from: camera.position.clone(), to };
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === name));
}
controls.addEventListener('start', () => { state.camAnim = null; });

// ---------- UI ----------
const openRange = document.getElementById('openRange'), expRange = document.getElementById('expRange');
const openPct = document.getElementById('openPct'), openState = document.getElementById('openState');
function refreshReadout() {
  openPct.textContent = Math.round(state.frac * 100);
  openState.textContent = state.frac <= 0.001 ? '閉じた状態' : state.frac >= 0.999 ? '開いた状態（後傾41°）' : '開閉途中';
  openRange.value = Math.round(state.frac * 1000);
}
function animateFrac(to, dur) {
  state.anim = { from: state.frac, to, t: 0, dur: Math.max(dur * Math.abs(to - state.frac), 0.05) };
  state.playing = false;
  document.getElementById('btnPlay').classList.remove('on');
}
openRange.addEventListener('input', () => {
  state.frac = openRange.value / 1000; state.anim = null; state.playing = false;
  document.getElementById('btnPlay').classList.remove('on'); refreshReadout();
});
expRange.addEventListener('input', () => { state.explode = expRange.value / 100; });
document.getElementById('btnOpen').addEventListener('click', () => animateFrac(1, 1.6));
document.getElementById('btnClose').addEventListener('click', () => animateFrac(0, 1.6));
const btnPlay = document.getElementById('btnPlay');
btnPlay.addEventListener('click', () => {
  state.playing = !state.playing; state.anim = null; state.hold = 0;
  if (state.playing && state.frac >= 0.999) state.playDir = -1;
  if (state.playing && state.frac <= 0.001) state.playDir = 1;
  btnPlay.classList.toggle('on', state.playing);
});
const btnSpin = document.getElementById('btnSpin');
btnSpin.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnSpin.classList.toggle('on', controls.autoRotate);
});
const btnKb = document.getElementById('btnKb');
let kbHidden = false;
btnKb.addEventListener('click', () => {
  kbHidden = !kbHidden;
  btnKb.classList.toggle('on', kbHidden);
  btnKb.textContent = kbHidden ? 'HHKBを表示' : 'HHKBを隠す';
  for (const e of meshes) if (e.geo === 'kb') e.mesh.visible = !kbHidden;
});
const btnGhost = document.getElementById('btnGhost');
let ghost = false;
btnGhost.addEventListener('click', () => {
  ghost = !ghost;
  btnGhost.classList.toggle('on', ghost);
  for (const { mesh } of meshes) {
    const mat = mesh.material;
    mat.transparent = ghost;
    mat.opacity = ghost ? 0.35 : 1.0;
    mat.depthWrite = !ghost;
    mat.side = ghost ? THREE.DoubleSide : THREE.FrontSide;
    mat.needsUpdate = true;
  }
});
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => goView(b.dataset.view)));

// ---------- main loop ----------
const clock = new THREE.Clock();
const smoother = t => t * t * t * (t * (t * 6 - 15) + 10);
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (state.anim) {
    state.anim.t += dt / state.anim.dur;
    const k = smoother(Math.min(state.anim.t, 1));
    state.frac = state.anim.from + (state.anim.to - state.anim.from) * k;
    if (state.anim.t >= 1) state.anim = null;
    refreshReadout();
  } else if (state.playing) {
    if (state.hold > 0) { state.hold -= dt; }
    else {
      state.frac += state.playDir * dt / 2.4;
      if (state.frac >= 1) { state.frac = 1; state.playDir = -1; state.hold = 0.7; }
      if (state.frac <= 0) { state.frac = 0; state.playDir = 1; state.hold = 0.7; }
    }
    refreshReadout();
  }
  if (state.camAnim) {
    state.camAnim.t += dt / state.camAnim.dur;
    const k = smoother(Math.min(state.camAnim.t, 1));
    camera.position.lerpVectors(state.camAnim.from, state.camAnim.to, k);
    if (state.camAnim.t >= 1) state.camAnim = null;
  }
  updatePose(state.frac, state.explode);
  controls.update();
  renderer.render(scene, camera);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
refreshReadout();
tick();
setTimeout(() => animateFrac(1, 2.0), 400);   // 起動時にゆっくり開く
window.__viewerReady = true;
</script>
<script>
setTimeout(() => { if (!window.__viewerReady) document.getElementById('err').style.display = 'flex'; }, 6000);
</script>
</body>
